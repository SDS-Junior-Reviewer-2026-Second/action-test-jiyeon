name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 1
        run: echo "build-1"

  build-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 2
        run: echo "build-2"

  build-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 3
        run: echo "build-3"

  integration-1:
    needs: [ build-1 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Integration 1
        run: echo "integration-1"

  integration-2:
    needs: [ build-1 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Integration 2
        run: echo "integration-2"


  lint:
    needs: [ build-2 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Lint
        run: echo "lint"

  unittest:
    needs: [ build-3 ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-group: [ 1,2,3 ]
    steps:
      - uses: actions/checkout@v4
      - name: Unit Test ${{ matrix.test-group }}
        run: echo "unit-test group ${{ matrix.test-group }}"

  deploy:
    needs: [ integration-1, integration-2, lint, build-4 ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Deploy
        run: echo "deploy"